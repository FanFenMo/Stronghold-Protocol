<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>账号管理 · 卫戍协议：盟约</title>
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/admin.js"></script>
</head>
<body>
  <header><div><p class="eyebrow">STRONGHOLD PROTOCOL</p><h1>账号管理</h1></div>
    <a id="game-link" href="/">返回游戏</a></header>
  <main>
    <p id="notice" role="status" aria-live="polite"></p>
    <section aria-labelledby="accounts-title">
      <div class="section-head"><h2 id="accounts-title">匿名账号名册 <span id="account-total">0</span></h2><button id="refresh-accounts" type="button">刷新账号</button></div>
      <p class="hint">所有已建立的匿名档案均保存在服务器中，离线后仍可查询和发放奖杯。选择账号即可操作，同名账号请结合 ID 区分。</p>
      <form id="accounts-form" class="lookup"><input id="account-search" aria-label="搜索昵称、曾用名或 ID" maxlength="80" placeholder="搜索昵称、曾用名或 ID"><button>搜索账号</button></form>
      <div id="accounts" class="accounts"></div>
      <nav class="pages" aria-label="账号分页"><button id="accounts-prev" type="button">上一页</button><span id="accounts-page"></span><button id="accounts-next" type="button">下一页</button></nav>
    </section>
    <section aria-labelledby="matches-title">
      <div class="section-head"><h2 id="matches-title">进行中的对局 <span id="match-count">0</span></h2><button id="refresh-matches" type="button">刷新对局</button></div>
      <p class="hint">每 5 秒更新。观战会打开独立游戏窗口，可同时保留自己的对局。</p>
      <div id="matches"></div>
    </section>
    <section aria-labelledby="wallet-title">
      <div class="section-head"><h2 id="wallet-title">奖杯发放与调整</h2><button id="self-profile" type="button">我的档案</button></div>
      <form id="lookup-form"><label for="profile-id">匿名档案 ID</label><div class="lookup"><input id="profile-id" required autocomplete="off" placeholder="输入完整档案 ID"><button>查询档案</button></div></form>
      <p class="hint">可从上方名册选择账号，也可直接粘贴档案 ID 查询。</p>
      <form id="wallet-form" hidden>
        <h3 id="wallet-name"></h3><p id="wallet-names" class="hint"></p>
        <p class="id-line"><code id="wallet-id" class="mono"></code><button id="copy-profile" type="button">复制 ID</button></p>
        <p id="wallet-summary" class="hint"></p>
        <div class="wallet-mode"><button type="button" data-wallet-mode="grant" aria-pressed="true">发放奖杯</button><button type="button" data-wallet-mode="set" aria-pressed="false">直接调整</button></div>
        <div id="grant-fields"><label>发放数量<input id="grant-amount" type="number" min="1" max="9007199254740991" step="1" required></label>
          <label class="check"><input id="grant-earned" type="checkbox" checked>同时计入历史累计奖杯</label></div>
        <div id="set-fields" class="wallet-fields" hidden><label>可用奖杯<input id="balance" type="number" min="0" max="9007199254740991" step="1" required disabled></label>
          <label>历史累计奖杯<input id="earned" type="number" min="0" max="9007199254740991" step="1" required disabled></label></div>
        <label for="reason">修改原因</label><input id="reason" maxlength="200" required placeholder="例如：活动奖励、奖杯补偿或数据更正">
        <p class="hint">两项奖杯可分别调高、调低或归零。历史累计会影响解锁条件。</p>
        <button id="save-wallet">发放奖杯</button>
      </form>
      <div id="ledger"></div>
    </section>
  </main>
</body>
</html>
