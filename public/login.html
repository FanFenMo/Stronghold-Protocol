<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0f0e">
  <title>开服验证 · 卫戍协议：盟约</title>
  <link rel="stylesheet" href="/css/access.css">
  <script type="module" src="/js/access.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">STRONGHOLD PROTOCOL</p>
    <h1>卫戍协议：盟约</h1>
    <p class="intro">请输入主机本次开服设置的账号密码。</p>
    <form id="access-form">
      <label for="username">账号</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <p id="access-error" role="alert" aria-live="polite"></p>
      <button type="submit">进入游戏</button>
    </form>
    <p class="hint">主机留空的项也请留空。服务器重新开服后需重新验证。</p>
  </main>
</body>
</html>
